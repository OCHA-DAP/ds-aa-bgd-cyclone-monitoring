name: Monitor ECMWF cyclone tracks

on:
  schedule:
    # ECMWF runs four cycles a day and the track files land a few hours
    # after each. An hourly poll picks up each cycle soon after it is
    # published; idle polls exit after a HEAD request once the newest cycle
    # is in the monitoring log.
    - cron: '20 * * * *'

  # A push to the development branch runs a dry run, so changes can be
  # checked on Actions before they reach the default branch. Push runs
  # never send email or write to blob.
  push:
    branches: [feat/ecmwf-monitoring]
    paths:
      - 'src/**'
      - 'pipelines/**'
      - 'data/*.geojson'
      - 'requirements-monitoring.txt'
      - '.github/workflows/run_monitor_ecmwf.yml'

  workflow_dispatch:
    inputs:
      cycle:
        description: 'Process one ECMWF cycle (YYYY-MM-DDTHH, UTC)'
        required: false
        default: ''
      force:
        description: 'Process the cycle even if already logged'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Compute only, send no email and write nothing to blob'
        required: false
        type: boolean
        default: false

concurrency:
  # Never let two polls process the same cycle at once, which would
  # double-send. A queued run waits rather than being cancelled.
  group: monitor-ecmwf
  cancel-in-progress: false

jobs:
  run-monitoring:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-monitoring.txt

      - name: Install dependencies
        env:
          PIP_RETRIES: "5"
          PIP_TIMEOUT: "30"
        run: |
          for attempt in 1 2 3; do
            if python -m pip install -r requirements-monitoring.txt; then
              exit 0
            fi
            echo "dependency install failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Run monitoring
        env:
          # Workflow inputs go through the environment rather than being
          # interpolated into the shell.
          INPUT_CYCLE: ${{ github.event.inputs.cycle }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
          DSCI_LISTMONK_API_URL: ${{ secrets.DSCI_LISTMONK_API_URL }}
          DSCI_LISTMONK_API_USERNAME: ${{ secrets.DSCI_LISTMONK_API_USERNAME }}
          DSCI_LISTMONK_API_KEY: ${{ secrets.DSCI_LISTMONK_API_KEY }}
        run: |
          ARGS=()
          if [ -n "$INPUT_CYCLE" ]; then ARGS+=(--cycle "$INPUT_CYCLE"); fi
          if [ "$INPUT_FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$EVENT_NAME" = "push" ]; then ARGS+=(--dry-run); fi
          mkdir -p output
          python pipelines/monitor_ecmwf.py --save-html output/email.html "${ARGS[@]}"

      - name: Upload email preview
        # Kept with the run so every email, including dry runs, can be
        # checked from the Actions page.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: output/
          if-no-files-found: ignore
          retention-days: 30
